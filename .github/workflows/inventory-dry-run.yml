name: Estoque - Saneamento Estrutural Seguro tenant_2

on:
  workflow_dispatch:

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar acesso
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$GITHUB_WORKSPACE/.deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$GITHUB_WORKSPACE/.deploy_key"
      - name: Executar transação segura e auditoria pós-commit
        env:
          SSH_OPTS: -i ${{ github.workspace }}/.deploy_key -o UserKnownHostsFile=${{ github.workspace }}/.known_hosts -o StrictHostKeyChecking=accept-new
        run: |
          set -euo pipefail
          scp ${SSH_OPTS} backend/scripts/apply-safe-structural-sanitation.mjs root@187.77.225.233:/tmp/
          ssh ${SSH_OPTS} root@187.77.225.233 'set -euo pipefail; docker cp /tmp/apply-safe-structural-sanitation.mjs aura-api:/app/scripts/apply-safe-structural-sanitation.mjs; docker exec aura-api node /app/scripts/apply-safe-structural-sanitation.mjs; rm -f /tmp/apply-safe-structural-sanitation.mjs' | tee saneamento-auditoria.log
      - name: Publicar relatório de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saneamento-estrutural-auditoria
          path: saneamento-auditoria.log
      - name: Remover chave
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_key" "$GITHUB_WORKSPACE/.known_hosts"
