name: Estoque - Conciliação segura tenant_2

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar acesso
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$GITHUB_WORKSPACE/.deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$GITHUB_WORKSPACE/.deploy_key"
      - name: Executar conciliação transacional e auditoria
        env:
          SSH_OPTS: -i ${{ github.workspace }}/.deploy_key -o UserKnownHostsFile=${{ github.workspace }}/.known_hosts -o StrictHostKeyChecking=accept-new
        run: |
          set -euo pipefail
          scp ${SSH_OPTS} backend/scripts/apply-safe-inventory-reconciliation.mjs backend/scripts/physical-inventory-2026-08-12.json artifacts/inventory_reconciliation/safe-98-dry-run-result.json root@187.77.225.233:/tmp/
          ssh ${SSH_OPTS} root@187.77.225.233 'set -euo pipefail; docker cp /tmp/apply-safe-inventory-reconciliation.mjs aura-api:/app/scripts/apply-safe-inventory-reconciliation.mjs; docker cp /tmp/physical-inventory-2026-08-12.json aura-api:/app/scripts/physical-inventory-2026-08-12.json; docker cp /tmp/safe-98-dry-run-result.json aura-api:/app/scripts/safe-98-dry-run-result.json; docker exec aura-api node /app/scripts/apply-safe-inventory-reconciliation.mjs --data=/app/scripts/physical-inventory-2026-08-12.json --plan=/app/scripts/safe-98-dry-run-result.json | tee /tmp/inventory-apply-result.log; rm -f /tmp/apply-safe-inventory-reconciliation.mjs /tmp/physical-inventory-2026-08-12.json /tmp/safe-98-dry-run-result.json'
          scp ${SSH_OPTS} root@187.77.225.233:/tmp/inventory-apply-result.log inventory-apply-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-apply-result
          path: inventory-apply-result.log
      - name: Remover chave
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_key" "$GITHUB_WORKSPACE/.known_hosts"
