name: Estoque - Auditoria visual somente leitura tenant_2

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar acesso
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$GITHUB_WORKSPACE/.deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$GITHUB_WORKSPACE/.deploy_key"
      - name: Extrair snapshot somente leitura
        env:
          SSH_OPTS: -i ${{ github.workspace }}/.deploy_key -o UserKnownHostsFile=${{ github.workspace }}/.known_hosts -o StrictHostKeyChecking=accept-new
        run: |
          set -euo pipefail
          scp ${SSH_OPTS} backend/scripts/audit-reconciled-inventory-readonly.mjs root@187.77.225.233:/tmp/
          ssh ${SSH_OPTS} root@187.77.225.233 'set -euo pipefail; docker cp /tmp/audit-reconciled-inventory-readonly.mjs aura-api:/app/scripts/audit-reconciled-inventory-readonly.mjs; docker exec aura-api node /app/scripts/audit-reconciled-inventory-readonly.mjs --output=/tmp/aura-inventory-audit-snapshot.json; docker cp aura-api:/tmp/aura-inventory-audit-snapshot.json /tmp/aura-inventory-audit-snapshot.json; rm -f /tmp/audit-reconciled-inventory-readonly.mjs'
          scp ${SSH_OPTS} root@187.77.225.233:/tmp/aura-inventory-audit-snapshot.json aura-inventory-audit-snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: aura-inventory-audit-snapshot
          path: aura-inventory-audit-snapshot.json
      - name: Remover chave
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_key" "$GITHUB_WORKSPACE/.known_hosts"
