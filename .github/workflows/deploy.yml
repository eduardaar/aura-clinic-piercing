name: Deploy (produção)

# Deploy automático da Aura Clinic a cada push na main.
# Também pode ser disparado manualmente em Actions > Deploy (produção) > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Nunca deixa dois deploys rodarem ao mesmo tempo (o segundo espera o primeiro).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  SERVER_HOST: 187.77.225.233
  SERVER_USER: root
  API_URL: https://auraclinic.monitence.com/api
  SITE_URL: https://auraclinic.monitence.com
  REMOTE_COMPOSE_DIR: /home/auraclinic
  REMOTE_BACKEND: /home/auraclinic/backend
  REMOTE_FRONT: /home/nginx/front/auraclinic

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aura_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aura_clinic
      DATABASE_SSL: "false"
      AUTH_SECRET: aura-ci-secret-only-for-isolated-tests-2026
      PLATFORM_ADMIN_EMAIL: superadmin@aura.local
      PLATFORM_ADMIN_PASSWORD: superadmin123
      ALLOW_PUBLIC_SIGNUP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Testes do backend e migrations multi-tenant
        run: npm --prefix backend test

      - name: Testes e build do frontend
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build

  # Sem o secret da chave SSH não há como deployar — pula (verde) com um aviso,
  # em vez de falhar. Assim o primeiro push não quebra antes da configuração.
  guard:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret DEPLOY_SSH_KEY ausente — deploy pulado. Configure em Settings > Secrets and variables > Actions e rode de novo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [validate, guard]
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar chave SSH
        run: |
          install -m 600 /dev/null "$GITHUB_WORKSPACE/.deploy_key"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$GITHUB_WORKSPACE/.deploy_key"

      # Sem ssh-keyscan (que abre 1 conexão por tipo de chave e ajudava a
      # tropeçar no fail2ban). accept-new confia no host no 1º contato e a
      # conexão é multiplexada pelo deploy.sh (uma só para todo o deploy).
      # Os segredos do Asaas são repassados ao deploy.sh, que faz upsert no .env
      # DO SERVIDOR (o rsync exclui .env de propósito). Secret ausente/vazio é
      # pulado pelo script — nunca sobrescreve com vazio uma chave já em
      # produção. Configure em Settings > Secrets and variables > Actions.
      - name: Deploy
        env:
          SSH_OPTS: -i ${{ github.workspace }}/.deploy_key -o UserKnownHostsFile=${{ github.workspace }}/.known_hosts -o StrictHostKeyChecking=accept-new
          ASAAS_BASE_URL: ${{ secrets.ASAAS_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_VAULT_KEY: ${{ secrets.ASAAS_VAULT_KEY }}
          # Base SEM o /api: as rotas já declaram o caminho completo
          # (/api/webhooks/asaas/<slug>). Usar API_URL aqui duplicaria o /api
          # na URL que a clínica cola no painel do Asaas.
          PUBLIC_API_URL: ${{ env.SITE_URL }}
        run: bash scripts/deploy.sh

      - name: Limpar chave
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_key" "$GITHUB_WORKSPACE/.known_hosts"
