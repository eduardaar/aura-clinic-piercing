name: CI e Deploy

# Um workflow, dois papéis:
#
#   PULL REQUEST  roda só `validate`. É o portão: nenhum merge entra sem os
#                 testes, o typecheck e o build passando.
#   PUSH NA MAIN  roda `validate` e, se passar, publica em produção.
#
# Antes, o workflow disparava APENAS em push na main — o que significava que
# um PR não tinha verificação nenhuma e a única forma de descobrir que a branch
# quebrou algo era ela já estar indo para o ar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Voltar a API para a imagem anterior em vez de publicar a atual"
        type: boolean
        default: false

# Privilégio mínimo para o GITHUB_TOKEN. O default de muitos repositórios é
# permissivo; aqui o workflow só precisa LER o código — ele não abre issue, não
# comenta em PR e não publica pacote.
permissions:
  contents: read

concurrency:
  # Dois regimes, porque a consequência de cancelar é oposta em cada um:
  #
  #   PR      um grupo por branch, cancelando a execução anterior — um commit
  #           novo invalida a verificação do antigo, e deixá-la terminar só
  #           gasta runner.
  #   PRODUÇÃO  fila única, NUNCA cancelada no meio: abortar um deploy entre o
  #           rsync e o restart deixaria o servidor em estado inconsistente.
  #
  # Isto também conserta um problema real do desenho anterior, em que PR e
  # deploy dividiam o mesmo grupo `deploy-producao` com `cancel-in-progress:
  # false`: a verificação de um PR ficava presa na fila atrás de um deploy.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || 'producao' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVER_HOST: 187.77.225.233
  SERVER_USER: root
  API_URL: https://auraclinic.monitence.com/api
  SITE_URL: https://auraclinic.monitence.com
  REMOTE_COMPOSE_DIR: /home/auraclinic
  REMOTE_BACKEND: /home/auraclinic/backend
  REMOTE_FRONT: /home/nginx/front/auraclinic

jobs:
  validate:
    name: Testes, tipos e build
    runs-on: ubuntu-latest
    # A suíte leva ~2 min; 20 é folga generosa. Sem teto, um teste pendurado
    # ocuparia o runner por 6 horas (o default do GitHub) antes de desistir.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aura_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aura_clinic
      DATABASE_SSL: "false"
      AUTH_SECRET: aura-ci-secret-only-for-isolated-tests-2026
      PLATFORM_ADMIN_EMAIL: superadmin@aura.local
      PLATFORM_ADMIN_PASSWORD: superadmin123
      ALLOW_PUBLIC_SIGNUP: "true"
      # Nenhuma credencial do Asaas aqui, de PROPÓSITO: sem elas a integração
      # sobe desligada, e é justamente esse estado que os testes exercitam (o
      # webhook precisa REJEITAR quando não há token configurado). Pôr uma chave
      # real na CI também faria a suíte bater no gateway de verdade.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm ci

      # Verificação de tipos (checkJs + JSDoc). Passa limpo hoje, então entra
      # como bloqueante: era a metade que faltava da pendência 9 das docs.
      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes do backend e migrations multi-tenant
        run: npm --prefix backend test

      - name: Testes e build do frontend
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build

      # Informativo, NÃO bloqueante: o repositório carrega ~84 achados antigos
      # (pendência 12) e reprovar o PR por eles pararia o trabalho de todo mundo
      # sem relação com a mudança. Fica visível no log para a dívida não crescer
      # em silêncio; vira bloqueante quando o passivo for zerado.
      - name: Lint (informativo)
        continue-on-error: true
        run: npm run lint

  # Sem o secret da chave SSH não há como deployar — pula (verde) com um aviso,
  # em vez de falhar. Assim o primeiro push não quebra antes da configuração.
  guard:
    name: Pré-requisitos do deploy
    needs: validate
    # PR nunca publica: valida e para.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_BASE_URL: ${{ vars.ASAAS_BASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_PUBLIC: ${{ secrets.R2_BUCKET_PUBLIC }}
          R2_BUCKET_PRIVATE: ${{ secrets.R2_BUCKET_PRIVATE }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          # Os secrets vêm por env, e não interpolados no script: um valor com
          # aspas ou quebra de linha quebraria o shell se fosse colado no corpo.
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::warning::Secret DEPLOY_SSH_KEY ausente — deploy pulado. Configure em Settings > Secrets and variables > Actions e rode de novo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Par indivisível: a API recusa subir em produção com chave e sem
          # token (o webhook ficaria aberto). Melhor avisar aqui do que deixar o
          # container reiniciar em laço depois do deploy.
          if [ -n "${ASAAS_API_KEY}" ] && [ -z "${ASAAS_WEBHOOK_TOKEN}" ]; then
            echo "::error::ASAAS_API_KEY configurada sem ASAAS_WEBHOOK_TOKEN. Sem o token o webhook do Asaas fica aberto e a API recusa subir em produção."
            exit 1
          fi
          if [ -z "${ASAAS_API_KEY}" ]; then
            echo "::notice::Asaas não configurado — a cobrança online sobe desligada. Isso é esperado até os secrets serem preenchidos."
          fi

          # Chave de produção apontando para o sandbox cobra de mentira: o
          # cliente vê "pago" e o dinheiro nunca entra. O boot da API também
          # avisa, mas ali o aviso já está no log do container, longe de quem
          # apertou o botão. Aviso, não erro — homologação é caso legítimo.
          if [ -n "${ASAAS_API_KEY}" ] && [ "${ASAAS_BASE_URL}" != "https://api.asaas.com/v3" ]; then
            echo "::warning::ASAAS_BASE_URL não é a URL de produção (https://api.asaas.com/v3). Valor atual: '${ASAAS_BASE_URL:-<vazio, o código cai no sandbox>}'. A cobrança das clínicas não será real."
          fi

          # R2 pela metade grava arquivo que ninguém consegue ler depois, então
          # a API RECUSA subir em produção nessa condição (config/index.js).
          # Nomear um bucket é a declaração de intenção de usar o R2; a partir
          # daí o conjunto é indivisível. Erra aqui para o container não entrar
          # em laço de reinício depois do deploy — mesma lógica do par
          # ASAAS_API_KEY/ASAAS_WEBHOOK_TOKEN acima.
          if [ -n "${R2_BUCKET_PUBLIC}" ] || [ -n "${R2_BUCKET_PRIVATE}" ]; then
            r2_faltando=""
            for v in R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_PUBLIC R2_BUCKET_PRIVATE R2_PUBLIC_BASE_URL; do
              [ -n "${!v:-}" ] || r2_faltando="${r2_faltando} ${v}"
            done
            if [ -n "${r2_faltando}" ]; then
              echo "::error::Configuração do R2 incompleta — faltam:${r2_faltando}. Ou preencha todos os seis secrets, ou apague R2_BUCKET_PUBLIC/R2_BUCKET_PRIVATE para seguir no disco local. A API recusa subir em produção com R2 pela metade."
              exit 1
            fi
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (produção)
    needs: [validate, guard]
    if: github.event_name != 'pull_request' && needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Ambiente do GitHub: dá histórico de deploys, mostra a URL no PR e permite
    # exigir aprovação manual (Settings > Environments > production) sem tocar
    # neste arquivo. Enquanto nenhuma regra for criada, não muda nada.
    environment:
      name: production
      url: https://auraclinic.monitence.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar chave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$GITHUB_WORKSPACE/.deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "$GITHUB_WORKSPACE/.deploy_key"

      # Sem ssh-keyscan (que abre 1 conexão por tipo de chave e ajudava a
      # tropeçar no fail2ban). accept-new confia no host no 1º contato e a
      # conexão é multiplexada pelo deploy.sh (uma só para todo o deploy).
      #
      # Os segredos do Asaas e do R2 são repassados ao deploy.sh, que faz upsert
      # no .env DO SERVIDOR (o rsync exclui .env de propósito). Secret
      # ausente/vazio é pulado pelo script — nunca sobrescreve com vazio uma
      # chave já em produção. Configure em Settings > Secrets and variables >
      # Actions.
      - name: Deploy
        env:
          SSH_OPTS: -i ${{ github.workspace }}/.deploy_key -o UserKnownHostsFile=${{ github.workspace }}/.known_hosts -o StrictHostKeyChecking=accept-new
          ROLLBACK: ${{ inputs.rollback }}
          ASAAS_BASE_URL: ${{ vars.ASAAS_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_VAULT_KEY: ${{ secrets.ASAAS_VAULT_KEY }}
          # Base SEM o /api: as rotas já declaram o caminho completo
          # (/api/webhooks/asaas/<slug>). Usar API_URL aqui duplicaria o /api
          # na URL que a clínica cola no painel do Asaas.
          PUBLIC_API_URL: ${{ env.SITE_URL }}
          # Cloudflare R2 (armazenamento de arquivos). Enquanto os secrets não
          # existirem, todos chegam vazios, o script os pula e a API continua
          # gravando no disco do container — que é o comportamento de hoje.
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_PUBLIC: ${{ secrets.R2_BUCKET_PUBLIC }}
          R2_BUCKET_PRIVATE: ${{ secrets.R2_BUCKET_PRIVATE }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: bash scripts/deploy.sh

      - name: Limpar chave
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_key" "$GITHUB_WORKSPACE/.known_hosts"
